name: Ticket Intake & Routing Interface
description: 'Vendor-neutral integration interface record operationalising the Ticket Intake & Routing
  Service contract of the customer service ticketing platform generic system class (service management
  sector). The interface specifies the means and shape of the exchange (request-response); the contract
  itself is owned by the ISS catalogue record (see service_binding), and the API contract that may specify
  this boundary is a separate entity (dea:API) per the CR-021 D-4 disposition. The substitutability
  test passes: materially different vendor implementations can operationalise the same boundary. Vendor
  corroboration is evidence only; at least 3 distinct vendor systems are cited and no vendor product
  is canonical (per G-12).'
