name: DAG Scheduling Interface
description: 'Vendor-neutral integration interface record operationalising the DAG Scheduling Service
  contract of the workflow orchestration platform generic system class (data analytics sector). The
  interface specifies the means and shape of the exchange (batch); the contract itself is owned by the
  ISS catalogue record (see service_binding), and the API contract that may specify this boundary is
  a separate entity (dea:API) per the CR-021 D-4 disposition. The substitutability test passes: materially
  different vendor implementations can operationalise the same boundary. Vendor corroboration is evidence
  only; at least 3 distinct vendor systems are cited and no vendor product is canonical (per G-12).'
