id: dea:integration-interface-card-payment-network-authorization-clearing-settlement-chargeback-representment
type: IntegrationInterface
name: Chargeback & Representment Interface
description: 'Vendor-neutral integration interface record operationalising the Chargeback & Representment
  Service contract of the card payment network generic system class (financial services sector). The
  interface specifies the means and shape of the exchange (request-response); the contract itself is
  owned by the ISS catalogue record (see service_binding), and the API contract that may specify this
  boundary is a separate entity (dea:API) per the CR-021 D-4 disposition. The substitutability test
  passes: materially different vendor implementations can operationalise the same boundary. Vendor corroboration
  is evidence only; at least 3 distinct vendor systems are cited and no vendor product is canonical
  (per G-12).'
