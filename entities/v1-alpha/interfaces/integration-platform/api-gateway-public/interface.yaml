id: dea:integration-interface-api-gateway-public
type: IntegrationInterface
name: API Gateway Public Interface
description: 'Vendor-neutral public API gateway integration interface: the interaction boundary through
  which the API Gateway Service contract (publication, protection and observation of APIs offered to
  internal applications and external partner channels) is exchanged. The interface specifies the means
  and shape of the exchange; the contract is owned by the ISS catalogue record (see service_binding).
  Resolves the ISC registry forward reference isc-rel-007 and the exposure asserted by the CR-IS-CAT-03D
  ISS record. Vendor corroboration is evidence only; at least 3 distinct vendor systems are cited and
  no vendor product is canonical (per G-12).'
version: 1.0.0
lifecycle_status: active
interface_kind: rest-api
consumer_class: mixed
interaction_pattern: request-response
external_references:
- system: Amazon Web Services
  identifier: API Gateway
- system: Microsoft Azure
  identifier: API Management
- system: Google Cloud
  identifier: Apigee
tags:
- interface-kind:rest-api
- consumer-class:mixed
- interaction-pattern:request-response
- sector:technology-infrastructure-devops
- system-class:integration-platform
service_binding:
  service_id: dea:information-system-service-api-gateway-service
  binding_status: bound
governance:
  functional_owner: IS Semantic Architecture programme
  steward: IS Semantic Architecture programme
  approval_status: proposed
  review_date: '2027-11-10'
  source_and_evidence: 'Metamodel clause: dea-metamodel schemas/entities/integration-interface.json
    (IntegrationInterface, L5-integration, CR-021 D-4). Admitting CR: CR-IS-CAT-04B (population; legacy
    anchor admission). Vendor evidence (3 distinct vendor systems, evidence only per G-12): Amazon Web
    Services (identifier API Gateway); Microsoft Azure (identifier API Management); Google Cloud (identifier
    Apigee).'
metadata:
  cr: CR-IS-CAT-04B
  created_by: Emmanuel A. Otchere
  created_date: '2026-11-11'
  notes: Legacy anchor interface referenced by the ISC registry (isc-rel-007, CR-IS-CAT-02D) and by
    the ISS api-gateway-service record exposure; one of the five anchors of the CR-IS-CAT-04B population.
