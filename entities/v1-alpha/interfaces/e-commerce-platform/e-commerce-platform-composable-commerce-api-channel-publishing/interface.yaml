id: dea:integration-interface-e-commerce-platform-composable-commerce-api-channel-publishing
type: IntegrationInterface
name: Channel Publishing Interface
description: 'Vendor-neutral integration interface record operationalising the Channel Publishing Service
  contract of the e commerce platform generic system class (commerce retail sector). The interface specifies
  the means and shape of the exchange (batch); the contract itself is owned by the ISS catalogue record
  (see service_binding), and the API contract that may specify this boundary is a separate entity (dea:API)
  per the CR-021 D-4 disposition. The substitutability test passes: materially different vendor implementations
  can operationalise the same boundary. Vendor corroboration is evidence only; at least 3 distinct vendor
  systems are cited and no vendor product is canonical (per G-12).'
