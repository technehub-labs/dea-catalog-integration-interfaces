id: dea:integration-interface-agent-orchestrator-internal
type: IntegrationInterface
name: Agent Orchestrator Internal Interface
description: 'Vendor-neutral internal agentic execution integration interface: the interaction boundary
  through which the Agent Orchestrator component exchanges agent invocation, tool-call and execution-state
  traffic with internal machine consumers. The interface is exposed by a component rather than bound
  to a single service contract (see component_binding). Resolves the ISC registry forward reference
  isc-rel-203. Vendor corroboration is evidence only; at least 3 distinct vendor systems are cited and
  no vendor product is canonical (per G-12).'
version: 1.0.0
lifecycle_status: active
interface_kind: rpc
consumer_class: internal-machine
interaction_pattern: request-response
external_references:
- system: Amazon Web Services
  identifier: Bedrock Agents
- system: Google Cloud
  identifier: Vertex AI Agent Engine
- system: Microsoft Azure
  identifier: AI Foundry Agent Service
tags:
