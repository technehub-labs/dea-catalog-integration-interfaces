id: dea:integration-interface-identity-broker-public
type: IntegrationInterface
name: Identity Broker Public Interface
description: 'Vendor-neutral public identity integration interface: the interaction boundary through
  which the Identity Broker component of the Identity and Access Management (IAM) Platform exchanges
  authentication and federation traffic with internal and external relying parties. The interface is
  exposed by a component rather than bound to a single service contract (see component_binding). Resolves
  the ISC registry forward reference isc-rel-014. Vendor corroboration is evidence only; at least 3
  distinct vendor systems are cited and no vendor product is canonical (per G-12).'
version: 1.0.0
lifecycle_status: active
interface_kind: rest-api
consumer_class: mixed
interaction_pattern: request-response
external_references:
- system: Ping Identity
  identifier: PingFederate
- system: Microsoft Entra ID
  identifier: Entra External ID
- system: Keycloak
  identifier: Identity Brokering
tags:
- interface-kind:rest-api
- consumer-class:mixed
- interaction-pattern:request-response
- sector:identity-security
- system-class:identity-and-access-management-iam-platform
component_binding:
  component_id: dea:information-system-component-identity-broker
  binding_status: bound
governance:
  functional_owner: IS Semantic Architecture programme
  steward: IS Semantic Architecture programme
  approval_status: proposed
  review_date: '2027-11-10'
  source_and_evidence: 'Metamodel clause: dea-metamodel schemas/entities/integration-interface.json
    (IntegrationInterface, L5-integration, CR-021 D-4). Admitting CR: CR-IS-CAT-04B (population; legacy
    anchor admission). Vendor evidence (3 distinct vendor systems, evidence only per G-12): Ping Identity
    (identifier PingFederate); Microsoft Entra ID (identifier Entra External ID); Keycloak (identifier
    Identity Brokering).'
