id: dea:integration-interface-identity-api
type: IntegrationInterface
name: Identity API
description: 'Vendor-neutral identity API integration interface: the interaction boundary through which
  the Identity Service contract (authentication, federation, token issuance) is exchanged with internal
  applications and external customer channels. The interface specifies the means and shape of the exchange;
  the contract is owned by the ISS catalogue record (see service_binding), and the API contract that
  may specify this boundary is a separate entity (dea:API) per the CR-021 D-4 disposition. Resolves
  the ISF registry forward reference rel:identity-service-exposes-identity-api. Vendor corroboration
  is evidence only; at least 3 distinct vendor systems are cited and no vendor product is canonical
  (per G-12).'
version: 1.0.0
lifecycle_status: active
interface_kind: rest-api
consumer_class: mixed
interaction_pattern: request-response
external_references:
- system: Microsoft Entra ID
  identifier: Graph API
- system: Okta
  identifier: Auth API
- system: Keycloak
  identifier: Admin REST API
tags:
- interface-kind:rest-api
- consumer-class:mixed
- interaction-pattern:request-response
- sector:identity-security
- system-class:identity-and-access-management-iam-platform
service_binding:
  service_id: dea:information-system-service-identity-service
  binding_status: bound
governance:
  functional_owner: IS Semantic Architecture programme
  steward: IS Semantic Architecture programme
  approval_status: proposed
  review_date: '2027-11-10'
  source_and_evidence: 'Metamodel clause: dea-metamodel schemas/entities/integration-interface.json
    (IntegrationInterface, L5-integration, CR-021 D-4). Admitting CR: CR-IS-CAT-04B (population; legacy
    anchor admission). Vendor evidence (3 distinct vendor systems, evidence only per G-12): Microsoft
    Entra ID (identifier Graph API); Okta (identifier Auth API); Keycloak (identifier Admin REST API).'
metadata:
  cr: CR-IS-CAT-04B
  created_by: Emmanuel A. Otchere
  created_date: '2026-11-11'
  notes: Legacy anchor interface referenced by the ISF registry (rel:identity-service-exposes-identity-api,
    CR-IS-CAT-01D) and admitted here; one of the five anchors of the CR-IS-CAT-04B population.
